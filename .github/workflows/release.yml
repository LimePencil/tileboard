name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Match tag, Cargo.toml, and Cargo.lock
        run: python scripts/package_release.py --tag "$RELEASE_TAG" --check
      - name: Verify the GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      RUSTFLAGS: ${{ matrix.os == 'windows-2022' && '-C target-feature=+crt-static' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target "$RELEASE_TARGET"
          rustup default stable
      - name: Test on the native platform
        run: cargo test --locked --all-targets --target "$RELEASE_TARGET"
      - name: Build optimized binary
        run: cargo build --release --locked --target "$RELEASE_TARGET"
      - name: Verify and package binary
        run: python scripts/package_release.py --tag "$RELEASE_TAG" --target "$RELEASE_TARGET"
      - name: Stage release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Attach binaries and checksums
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Generate SHA-256 manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          archives = sorted(Path('dist').iterdir())
          assert len(archives) == 5, 'Expected all five platform archives'
          assert all(p.is_file() and p.name.startswith('tileboard-') and p.name.endswith(('.tar.gz', '.zip')) for p in archives)
          lines = [f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in archives]
          Path('dist/SHA256SUMS').write_text(''.join(lines), encoding='utf-8')
          PY
      - name: Upload complete release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
