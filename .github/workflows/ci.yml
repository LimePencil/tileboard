name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install shell test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck fish zsh
          shellcheck install.sh
      - name: Installer fixture tests
        if: runner.os != 'Windows'
        run: python3 scripts/test_installer.py
      - name: PowerShell 5.1 installer tests
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test_installer.ps1
      - name: PowerShell 7 installer tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_installer.ps1
      - name: Windows shell installer smoke test
        if: runner.os == 'Windows'
        shell: bash
        run: |
          install_dir="$(cygpath -u "$RUNNER_TEMP")/tileboard installer/bin"
          profile="$(cygpath -u "$RUNNER_TEMP")/tileboard installer/profile"
          sh install.sh --bin-dir "$install_dir" --profile "$profile" --shell bash
          sh install.sh --bin-dir "$install_dir" --profile "$profile" --shell bash
          # shellcheck disable=SC1090
          . "$profile"
          tileboard --version
          TILEBOARD_WINDOWS_INSTALL_DIR="$(cygpath -w "$install_dir")"
          export TILEBOARD_WINDOWS_INSTALL_DIR
          # shellcheck disable=SC2016
          powershell.exe -NoProfile -NonInteractive -Command '
            $entries = [Environment]::GetEnvironmentVariable("Path", "User") -split ";"
            if (@($entries | Where-Object { $_ -eq $env:TILEBOARD_WINDOWS_INSTALL_DIR }).Count -ne 1) { exit 1 }
          '
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Validate example layouts
        run: |
          cargo run --locked -- --config examples/dashboard.toml --check
          cargo run --locked -- --config examples/all-tiles.toml --check
      - name: Terminal UI smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          cargo build --locked
          python3 scripts/ui_smoke.py
