[package]
name = "tileboard"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "A customizable terminal dashboard with a responsive snapping grid"
repository = "https://github.com/LimePencil/tileboard"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
directories = "6"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
starship-battery = { version = "0.11", default-features = false }
sysinfo = "0.39"
tempfile = "3"
toml = "0.9"
unicode-segmentation = "1.13"
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
